[project]
name = "scpad"
version = "0.1.0"
description = "Deterministic offline ambient rendering: recipe in, reproducible WAV out"
readme = "README.md"
authors = [
    { name = "Daniel James Pritchett", email = "dpritchett@gmail.com" }
]
requires-python = ">=3.11"
# Code and recipes are MIT. Audio rendered from the recipes and distributed by
# the author is CC BY-NC 4.0 -- see LICENSE-SOUNDS.md, which this field cannot
# express and does not try to.
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    # Runtime, not dev: wavio.py decodes samples with it and analysis.py is on
    # the `scpad measure` and `scpad render` paths, so an install without numpy
    # gets a CLI that imports and then dies.
    "numpy>=2.4.6",
    "supriya>=26.3b0",
]

[project.scripts]
scpad = "scpad.cli:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
# No slow/fast split. NRT rendering runs ~67x realtime, so a full 111s piece
# costs under two seconds -- there is nothing here worth deferring.

[dependency-groups]
dev = [
    "doit>=0.37.0",
    "pytest>=9.1.1",
]
