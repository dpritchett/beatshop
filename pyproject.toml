[project]
name = "scpad"
version = "0.1.0"
description = "Deterministic offline ambient rendering: recipe in, reproducible WAV out"
readme = "README.md"
authors = [
    { name = "Daniel James Pritchett", email = "dpritchett@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "supriya>=26.3b0",
]

[project.scripts]
scpad = "scpad.cli:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
# No slow/fast split. NRT rendering runs ~67x realtime, so a full 111s piece
# costs under two seconds -- there is nothing here worth deferring.

[dependency-groups]
dev = [
    "numpy>=2.4.6",
    "pytest>=9.1.1",
]
